name: Build Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true

      - name: Lint
        run: pnpm lint

      - name: Build extension
        run: pnpm build

      - name: Create ZIP archive
        run: cd dist && zip -9 -r ../ancroo-web-extension.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ancroo-web-extension
          path: ancroo-web-extension.zip
          retention-days: 30

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ancroo-web-extension
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ancroo-web-extension.zip
          generate_release_notes: true
          body: |
            ## Download

            | File | Description |
            |------|-------------|
            | `ancroo-web-extension.zip` | Chrome/Edge extension (Manifest V3) |

            ## Installation

            1. Download `ancroo-web-extension.zip`
            2. Extract to a folder
            3. Open Chrome → `chrome://extensions/`
            4. Enable **Developer mode** (top right)
            5. Click **Load unpacked** → select the extracted folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
